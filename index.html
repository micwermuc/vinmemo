<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VinMemo</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>

<body>

<header>
<h1>VinMemo</h1>
</header>

<section id="home" class="page">
<div class="card clickable" onclick="showPage('keller')">
<h2>Keller</h2>
<p id="countKeller">0 Flaschen</p>
</div>

<div class="card clickable" onclick="showPage('wishlist')">
<h2>Wishlist</h2>
<p id="countWishlist">0 Weine</p>
</div>

<div class="card clickable" onclick="showPage('archiv')">
<h2>Archiv</h2>
<p id="countArchiv">0 Weine</p>
</div>
</section>

<section id="keller" class="page hidden">
<h2>Keller</h2>
<div id="kellerListe"></div>
<button id="addWine">Wein hinzufügen</button>
</section>

<section id="wishlist" class="page hidden">
<h2>Wishlist</h2>
<div id="wishlistListe"></div>
</section>

<section id="archiv" class="page hidden">
<h2>Archiv</h2>
<div id="archivListe"></div>
</section>

<section id="settings" class="page hidden">
<h2>Einstellungen</h2>
</section>

<div id="detailModal" class="modal hidden">
<div class="modalContent">

<button class="closeBtn" onclick="closeModal()">X</button>
<button class="editBtn" onclick="toggleEdit()">✏️</button>

<div id="viewMode">
<h2 id="viewName"></h2>
<p id="viewProducer"></p>
<p id="viewVintage"></p>
<p id="viewRegion"></p>
<p id="viewCounter"></p>
<p id="viewNotes"></p>
</div>

<div id="editMode" class="hidden">
<input id="editName">
<input id="editProducer">
<input id="editVintage">
<input id="editRegion">
<textarea id="editNotes"></textarea>
<label><input type="checkbox" id="editWishlist"> Wishlist</label>
</div>

<div class="actions">
<button onclick="drinkBottle()">Flasche trinken</button>
<button onclick="addPurchase()">Nachkauf</button>
<button onclick="deleteWine()">Löschen</button>
</div>

</div>
</div>

<nav class="bottomNav">
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('keller')">Keller</button>
<button onclick="showPage('wishlist')">Wishlist</button>
<button onclick="showPage('archiv')">Archiv</button>
</nav>

<script src="app.js"></script>

</body>
</html>
