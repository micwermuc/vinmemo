<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VinMemo</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>VinMemo</h1>
</header>

<section id="home" class="page">
<h2>Übersicht</h2>
<p id="stats"></p>
</section>

<section id="keller" class="page hidden">
<h2>Keller</h2>
<div id="wineList"></div>
<button id="addWine">Wein hinzufügen</button>
</section>

<section id="wishlist" class="page hidden">
<h2>Wishlist</h2>
<div id="wishlistList"></div>
</section>

<section id="archiv" class="page hidden">
<h2>Archiv</h2>
<div id="archivList"></div>
</section>

<section id="settings" class="page hidden">
<h2>Einstellungen</h2>
<p>Weitere Optionen folgen.</p>
</section>

<div id="modal" class="modal hidden">
<div class="modal-card">

<div class="modal-header">
<span id="editBtn">✏️</span>
<span id="closeBtn">✕</span>
</div>

<div id="viewMode">
<h3 id="viewName"></h3>
<p id="viewProducer"></p>
<p id="viewVintage"></p>
<p id="viewRegion"></p>
<p id="viewCounter"></p>
<p id="viewNotes"></p>
</div>

<div id="editMode" class="hidden">
<input id="editName" placeholder="Name">
<input id="editProducer" placeholder="Produzent">
<input id="editVintage" placeholder="Jahrgang">
<input id="editRegion" placeholder="Region">
<textarea id="editNotes" placeholder="Notizen"></textarea>
<label><input type="checkbox" id="editWishlist"> Wishlist</label>
</div>

<div class="actions">
<button id="drinkBtn">Flasche trinken</button>
<button id="buyBtn">Nachkauf</button>
<button id="deleteBtn">Löschen</button>
</div>

</div>
</div>

<nav class="nav">
<button data-page="home">Home</button>
<button data-page="keller">Keller</button>
<button data-page="wishlist">Wishlist</button>
<button data-page="archiv">Archiv</button>
<button data-page="settings">Settings</button>
</nav>

<script src="app.js"></script>

</body>
</html>
