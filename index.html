
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VinMemo</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>

<body>

<header>
<h1>VinMemo</h1>
</header>

<section id="home" class="page">
<div class="card clickable" onclick="showPage('keller')">
<h2>🍷 Keller</h2>
<p id="countKeller">0 Flaschen</p>
</div>

<div class="card clickable" onclick="showPage('wishlist')">
<h2>⭐ Wishlist</h2>
<p id="countWishlist">0 Weine</p>
</div>

<div class="card clickable" onclick="showPage('archiv')">
<h2>📦 Archiv</h2>
<p id="countArchiv">0 Weine</p>
</div>
</section>

<section id="keller" class="page hidden">
<h2>Keller</h2>
<div id="kellerListe"></div>
<button id="addWine">＋ Wein hinzufügen</button>
</section>

<section id="wishlist" class="page hidden">
<h2>Wishlist</h2>
<div id="wishlistListe"></div>
</section>

<section id="archiv" class="page hidden">
<h2>Archiv</h2>
<div id="archivListe"></div>
</section>

<div id="detailModal" class="modal hidden">
<div class="modalContent">

<button onclick="closeModal()">✕</button>

<h2 id="detailName"></h2>

<label>
<input type="checkbox" id="wishlistToggle"> Auf Wishlist
</label>

<p id="detailInfo"></p>

<p id="detailPreis"></p>
<p id="detailKaufdatum"></p>

<div id="rating"></div>

<textarea id="notes" placeholder="Notizen"></textarea>

<button onclick="saveNotes()">Notizen speichern</button>
<button onclick="drinkBottle()">Flasche trinken</button>
<button onclick="addBottle()">Flasche hinzufügen</button>
<button onclick="editWine()">Bearbeiten</button>
<button onclick="deleteWine()">Löschen</button>

</div>
</div>

<nav class="bottomNav">
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('keller')">Keller</button>
<button onclick="showPage('wishlist')">Wishlist</button>
<button onclick="showPage('archiv')">Archiv</button>
</nav>

<script src="app.js"></script>

</body>
</html>
