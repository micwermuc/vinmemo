
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VinMemo</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>

<body>

<header>
<h1>VinMemo</h1>
</header>

<section id="home" class="page">
<div class="card clickable" onclick="showPage('cellar')">
<h2>🍷 Keller</h2>
<p id="bottleCount">0 Flaschen</p>
</div>

<div class="card clickable" onclick="showPage('wishlist')">
<h2>⭐ Wishlist</h2>
<p id="wishlistCount">0 Weine</p>
</div>
</section>

<section id="cellar" class="page hidden">
<h2>Cellar</h2>
<div id="wineList"></div>
<button id="addWine">＋ Wein hinzufügen</button>
</section>

<section id="wishlist" class="page hidden">
<h2>Wishlist</h2>
<div id="wishlistList"></div>
</section>

<section id="settings" class="page hidden">
<h2>Settings</h2>

<div class="card">
<h3>Storage Locations</h3>
<ul id="locationList"></ul>
<button onclick="addLocation()">Add location</button>
</div>

<div class="card">
<h3>Glasses</h3>
<ul id="glassList"></ul>
<button onclick="addGlass()">Add glass</button>
</div>

</section>

<div id="detailModal" class="modal hidden">
<div class="modalContent">

<button onclick="closeModal()">✕</button>

<h2 id="detailName"></h2>

<label>
<input type="checkbox" id="wishlistToggle"> On Wishlist
</label>

<p id="detailInfo"></p>

<div id="rating"></div>

<textarea id="notes" placeholder="Notizen"></textarea>

<button onclick="saveNotes()">Save notes</button>
<button onclick="editWine()">Edit</button>
<button onclick="deleteWine()">Delete</button>

</div>
</div>

<nav class="bottomNav">
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('cellar')">Cellar</button>
<button onclick="showPage('wishlist')">Wishlist</button>
<button onclick="showPage('settings')">Settings</button>
</nav>

<script src="app.js"></script>

</body>
</html>
